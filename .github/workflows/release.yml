# A release: a tag v<version> pushed for the version in package.json. The checks, the page's typecheck and its build
# run, then a GitHub release is made with generated notes; a prerelease (0.3.0-beta.1) is marked as one. Copies find the
# release by its tag (install.sh, src/app/backroomUpdate.ts).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag is package.json's version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "tag $GITHUB_REF_NAME is not v$version, package.json's version"; exit 1; fi

      - run: npm ci

      - name: Checks
        run: |
          npm run check
          npm --workspace web run typecheck
          npm run build:web

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)
        env:
          GH_TOKEN: ${{ github.token }}
